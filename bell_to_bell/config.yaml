name: Bell to Bell
version: "0.5.0"
slug: bell_to_bell
description: A classroom day planner and gradebook in one, kept as JSON files in a folder you choose.
url: https://github.com/mbwp1234/bell-to-bell
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
homeassistant_api: true
ingress_port: 8099
panel_icon: mdi:bell-ring-outline
panel_title: School
# Grades are private: only admins see the sidebar panel.
panel_admin: true
map:
  - type: share
    read_only: false
options:
  data_dir: /share/classes
  now_sensor: true
  bell_notify: []
  bell_minutes: 2
schema:
  data_dir: str
  now_sensor: bool
  bell_notify:
    - str
  bell_minutes: int(0,30)
