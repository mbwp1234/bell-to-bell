<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bell to Bell</title>
<script>
/* Theme, set before the first paint. Auto: device light -> light; device dark -> dim while the
   sun is up, night after sunset. Sunset comes from HA's sun.sun via api/sun, cached in
   localStorage; with no sun reading yet a dark device gets night, as before. */
(function () {
  var mq = matchMedia("(prefers-color-scheme: dark)"), root = document.documentElement;
  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function sunDown() {
    var s = null; try { s = JSON.parse(get("btb.sun") || "null"); } catch (e) {}
    if (!s || (s.state !== "above_horizon" && s.state !== "below_horizon")) return null;
    var now = Date.now(), down = s.state === "below_horizon";
    if (down && s.rising && now >= s.rising) down = false;
    else if (!down && s.setting && now >= s.setting) down = true;
    return down;
  }
  function pick() {
    var m = get("btb.theme");
    if (m === "light" || m === "dim" || m === "night") return m;
    if (!mq.matches) return "light";
    return sunDown() === false ? "dim" : "night";
  }
  function apply() { var t = pick(), was = root.dataset.theme; root.dataset.theme = t; return t !== was; }
  apply();
  window.btbTheme = { apply: apply, pick: pick, mq: mq, mode: function () { return get("btb.theme") || "auto"; } };
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Three themes, picked in the head script: light (Mist), dim (Mist one step down, for a device
   in dark mode while the sun is up) and night (after sunset). The script always sets data-theme. */
:root{
  --bg:#DCE4E1;--surface:#F1F5F3;--sunk:#CFD9D5;--sunk2:#E5ECE9;--line:#D6DFDB;--line2:#BECBC6;
  --fg:#13201E;--fg2:#33433F;--muted:#4B5B57;--faint:#53625E;
  --accent:#0B5E51;--accent-ink:#0B5E51;--on-accent:#FFFFFF;--accent-soft:#D2E5DF;
  --live:#A63D1C;--low:#9A3719;--ok:#2B7F6E;--amber:#E39A33;
  --warn-soft:#F1E5D3;--warn-ink:#6E3A0D;--warn-line:#E3D2BA;--bad-soft:#F3DDD5;--bad-ink:#74280F;
  --ink:#13201E;--on-ink:#FFFFFF;--done:#33433F;
  --q1:#0B5E51;--q2:#2F8A78;--q3:#8CC5B8;--q4:#F2A63C;--q5:#B0421F;
  --q1t:#0B5E5133;--q2t:#2F8A7833;--q3t:#8CC5B855;--q4t:#F2A63C40;--q5t:#B0421F33;
  --scrim:rgba(19,32,30,.42);--shadow:0 10px 40px rgba(0,0,0,.18);
  --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
:root[data-theme="dim"]{
  --bg:#C8D2CE;--surface:#DCE3E0;--sunk:#BAC6C1;--sunk2:#D1DAD6;--line:#C4CEC9;--line2:#A9B7B2;
  --fg:#101C1A;--fg2:#2A3935;--muted:#3A4844;--faint:#45544F;
  --accent:#0A5549;--accent-ink:#094C42;--on-accent:#FFFFFF;--accent-soft:#C2D8D1;
  --live:#9A3719;--low:#8E3316;--ok:#26705F;--amber:#D08A2A;
  --warn-soft:#E5D8C3;--warn-ink:#5E3108;--warn-line:#D3C2A6;--bad-soft:#E6CFC6;--bad-ink:#6A240D;
  --ink:#101C1A;--on-ink:#FFFFFF;--done:#2A3935;
  --q1:#0A5549;--q2:#26705F;--q3:#7FB5A8;--q4:#D08A2A;--q5:#9A3719;
  --q1t:#0A554933;--q2t:#26705F33;--q3t:#7FB5A855;--q4t:#D08A2A40;--q5t:#9A371933;
  --scrim:rgba(16,28,26,.45);color-scheme:light}
:root[data-theme="night"]{
  --bg:#0E1513;--surface:#18211F;--sunk:#222D2A;--sunk2:#1C2624;--line:#26322F;--line2:#33433F;
  --fg:#E8EFED;--fg2:#C3D0CD;--muted:#9DB0AC;--faint:#8A9C98;
  --accent:#6CC9B3;--accent-ink:#8FDCC8;--on-accent:#06211C;--accent-soft:#14302A;
  --live:#FF8A5B;--low:#FF9B7A;--ok:#6CC9B3;--amber:#E3A14A;
  --warn-soft:#2C2318;--warn-ink:#EDB97F;--warn-line:#43341F;--bad-soft:#3A1D16;--bad-ink:#FFB49C;
  --ink:#E8EFED;--on-ink:#0E1513;--done:#C3D0CD;
  --q1:#6CC9B3;--q2:#3E9C88;--q3:#2C6A5F;--q4:#C9853F;--q5:#E9772A;
  --q1t:#6CC9B333;--q2t:#3E9C8833;--q3t:#2C6A5F66;--q4t:#C9853F40;--q5t:#E9772A33;
  --scrim:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,textarea,select{font-family:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1280px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-left)) 110px max(16px,env(safe-area-inset-right))}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.top .ttl{min-width:0;flex:1 1 300px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
h1{margin:2px 0 0;font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.1;display:flex;align-items:center;gap:10px;overflow-wrap:anywhere}
.lede{margin:4px 0 0;font-size:15px;color:var(--fg2);max-width:70ch}
.lede b.live{color:var(--live)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cdot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
h1 .cdot{width:12px;height:12px}
/* save pill */
.save{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 12px;border-radius:12px;background:var(--surface);font-size:13px;font-weight:600;white-space:nowrap}
.save i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.save.saving i{background:transparent;border:2px solid var(--muted);border-right-color:transparent;animation:spin .8s linear infinite}
.save.waiting{background:var(--warn-soft);color:var(--warn-ink)}.save.waiting i{background:var(--amber)}
.save.ro{background:var(--bad-soft);color:var(--bad-ink)}.save.ro i{background:var(--live)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:899px){.top .save.ok{display:none}}
@media (prefers-reduced-motion:reduce){.save.saving i{animation:none}}
/* buttons */
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 14px;border:0;border-radius:12px;background:var(--surface);font-weight:600;font-size:14px;text-decoration:none;color:var(--fg)}
.btn.sunk{background:var(--sunk)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.themeb{min-height:40px;padding:0 12px;font-size:13px}
.btn.inkb{background:var(--ink);color:var(--on-ink)}
.btn.block{width:100%;height:52px;font-size:16px;font-weight:700;border-radius:14px}
.btn:disabled{opacity:.5;cursor:default}
.kbd{font-size:11px;font-weight:600;border:1px solid var(--line2);border-radius:5px;padding:1px 6px;color:var(--muted)}
.btn.inkb .kbd{border-color:rgba(255,255,255,.4);color:inherit;opacity:.75}
.seg{display:flex;gap:2px;background:var(--sunk);border-radius:12px;padding:3px}
.seg button{flex:1;min-height:40px;padding:0 14px;border:0;border-radius:9px;background:none;font-weight:600;font-size:14px;color:var(--fg2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chip{max-width:320px;overflow:hidden;text-overflow:ellipsis;min-height:40px;padding:0 14px;border:0;border-radius:999px;background:var(--sunk);font-weight:600;font-size:13px;color:var(--fg2);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.link{border:0;background:none;padding:0;font:inherit;font-weight:600;color:var(--accent-ink);cursor:pointer;text-align:left;text-decoration:none}
.card{background:var(--surface);border-radius:18px;padding:16px 18px;min-width:0}
.card h2,.h2{margin:0;font-size:17px;font-weight:800}
.k{font-size:12px;font-weight:700;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px} .low{color:var(--low)}
.note-soft{background:var(--warn-soft);color:var(--warn-ink);border-radius:14px;padding:10px 14px;font-size:14px}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}
/* desktop nav */
.dnav{display:none}
@media (min-width:900px){.dnav{display:flex}.tabbar{display:none!important}.wrap{padding-bottom:40px}}
/* bottom tabs */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:4px 12px max(10px,env(safe-area-inset-bottom));box-shadow:0 -1px 0 var(--line)}
.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;border:0;background:none;font-size:11px;font-weight:600;color:var(--muted)}
.tabbar button[aria-current="page"]{color:var(--accent-ink)}
/* day + class strips */
.strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px;margin:0 -2px}
.strip::-webkit-scrollbar{display:none}
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin:8px 0 10px;max-width:560px}
.days button{min-height:44px;border:0;border-radius:10px;background:none;font-weight:600;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.days button small{font-size:11px;font-weight:500;color:var(--faint)}
.days button[aria-pressed="true"]{background:var(--surface);color:var(--fg)}
.days button.today::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--live);margin-top:2px}
.pill{flex:none;border:0;border-radius:12px;padding:7px 13px 8px;text-align:left;min-height:48px;background:var(--surface);color:var(--fg)}
.pill .a{display:block;font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.pill .b{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600}
.pill[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--fg)}
.pill.live{box-shadow:inset 0 0 0 2px var(--live)}.pill.live .a{color:var(--live)}
/* today */
/* Today: the plan reads in the main column; the worksheet, print list, homework and exit ticket
   sit in the side column, in the same place for every class. On a phone the side comes first. */
.todaygrid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
.todaygrid .side{order:-1}
@media (min-width:900px){.todaygrid{grid-template-columns:minmax(0,1fr) 340px;gap:18px}.todaygrid.wide{grid-template-columns:minmax(0,1fr) 460px}.todaygrid .side{order:0;position:sticky;top:12px}}
.railcard{min-width:0}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.side .printbox,.side .hwbox{margin:0;border-radius:18px;padding:14px 16px}
.side .hwbox{background:var(--surface)}
.side .hwbox .n,.side .printbox .n{margin-bottom:2px}
.wnote{margin:-4px 0 4px;font-size:14px;color:var(--fg2);max-width:70ch}
.files{padding:14px 16px}
.files .n,.cnote .n,.watchbox .n{font-size:12px;font-weight:700;color:var(--fg2);text-transform:uppercase;letter-spacing:.04em}
.files .row{margin-bottom:8px}
.fileb{width:100%;justify-content:flex-start;margin-top:6px;white-space:normal;text-align:left}
.fileb span{min-width:0;overflow-wrap:anywhere}
.wdock{position:sticky;bottom:86px;padding-top:12px;z-index:5}
.gpane{min-width:0}
.dayhead h2{font-size:22px;font-weight:800;letter-spacing:-.01em}
.dayhead .unit{font-size:13px;color:var(--muted);margin-top:2px}
.railcard .sub{font-size:15px;line-height:1.55;color:var(--fg2);margin:8px 0 12px;max-width:72ch}
@media (min-width:900px){.dayhead h2{font-size:26px}.railcard .sub{font-size:16.5px;line-height:1.6}}
/* the bell-to-bell bar: each section at its share of the period */
.tbar{display:flex;gap:3px;height:10px;margin:4px 0 8px}
.tbar button{position:relative;border:0;border-radius:3px;padding:0;background:var(--line2);overflow:hidden;min-width:0;text-align:left;color:var(--muted);font:inherit}
.tbar button.seg-past{background:var(--sunk2)}
.tbar button.seg-now{background:var(--bad-soft);box-shadow:inset 0 0 0 2px var(--live)}
.tbar button i{position:absolute;inset:0 auto 0 0;background:var(--live)}
.tbar .tn,.tbar .tt{display:none}
.tspare{min-width:0}
@media (min-width:900px){
  .tbar{height:48px}
  .tbar button{padding:5px 8px;background:var(--sunk);border-radius:8px}
  .tbar button.seg-past{background:var(--sunk2);color:var(--faint)}
  .tbar button.seg-now{color:var(--live)}
  .tbar button i{background:var(--live);opacity:.16}
  .tbar .tn{display:block;position:relative;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tbar .tt{display:block;position:relative;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}
.step{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding:12px 0;border-top:1px solid var(--line);align-items:baseline}
@media (min-width:900px){.step{grid-template-columns:78px minmax(0,1fr);gap:16px;padding:14px 0}}
.steps .step:first-child{border-top:0}
.step .t{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.step .m{display:block;font-size:12px;font-weight:500;color:var(--faint);font-variant-numeric:tabular-nums}
.step .n{font-size:16px;font-weight:700;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.step .n .tag{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.step .d{font-size:15px;line-height:1.55;color:var(--fg2);margin-top:3px;max-width:72ch}
@media (min-width:900px){.step .n{font-size:18px}.step .d{font-size:16.5px;line-height:1.6}.step .board{font-size:15px}.step .t{font-size:14px}}
.watchbox{margin-top:6px}
.cnote{margin-top:14px;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.cnote textarea{min-height:72px}
.earlier summary{cursor:pointer;color:var(--accent-ink);font-weight:600}
.earlier div{padding:6px 0;border-top:1px solid var(--line)}
.step .d p{margin:4px 0 0}
.step.past .t,.step.past .n,.step.past .m{color:var(--faint)}
.step.past .d{color:var(--faint)}
.step.now{background:var(--sunk2);box-shadow:inset 0 0 0 2px var(--live);border-radius:14px;padding:12px;margin:6px -12px;border-top:0}
.step.now + .step{border-top:0}
.step.now .t,.step.now .m{color:var(--live);font-weight:700}
.prog{height:4px;border-radius:2px;background:var(--sunk);overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;background:var(--live)}
.board{background:var(--sunk2);border-radius:10px;padding:10px 14px;margin-top:8px;font-family:var(--mono);font-size:13px;line-height:1.85;overflow-x:auto;white-space:nowrap}
.board .cap{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:normal;margin-bottom:4px}
.todaygrid.closed .board{font-size:16px}
.group{background:var(--warn-soft);border-radius:12px;padding:8px 12px 4px;margin-top:10px}
.group .gk{font-size:12px;font-weight:700;color:var(--warn-ink);padding-bottom:2px}
.group .kid{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;font-size:14px;border-top:1px solid var(--warn-line);text-decoration:none;color:inherit;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.group .kid:first-of-type{border-top:0}
.group .kid span:last-child{color:var(--warn-ink)}
.exit{background:var(--accent-soft);border-radius:12px;padding:10px 12px;margin-top:8px}
.exit .a{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line2);font-family:var(--mono);font-size:13px}
.watch{background:var(--warn-soft);border-radius:12px;padding:10px 12px 10px 28px;margin:8px 0 0;color:var(--fg)}
.watch li{margin:3px 0}
.printbox{background:var(--accent-soft);border-radius:12px;padding:10px 12px;margin:0 0 10px}
.printbox .n{font-size:12px;font-weight:700;color:var(--accent-ink);text-transform:uppercase;letter-spacing:.04em}
.printbox ul{margin:4px 0 0;padding-left:18px}
.printbox li{margin:3px 0}
.hwbox{background:var(--sunk2);border-radius:12px;padding:10px 12px;margin:0 0 10px}
.hwbox .n{font-size:12px;font-weight:700;color:var(--fg2);text-transform:uppercase;letter-spacing:.04em}
.hwr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line2)}
.hwbox .row+.hwr{border-top:0}
.hwr .btn{flex:none}
.hwr.owed .small{color:var(--warn-ink)}
.hwk{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--accent-ink);margin-right:4px}
.hwr.owed .hwk{color:var(--warn-ink)}
.hwtl{font-weight:500;color:var(--fg);text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.hwt{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent-ink)}
input[type=date]{font-size:16px;height:46px;border:0;border-radius:12px;background:var(--sunk2);padding:0 12px;width:100%;color:var(--fg)}
.gap{border:1.5px dashed var(--line2);border-radius:12px;padding:12px;margin-top:10px;background:var(--sunk2)}
.reqbox{background:var(--warn-soft);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;margin-top:10px}
.reqbox b{color:var(--warn-ink)}
.reqbox input{font-size:16px;height:46px;border:0;border-radius:10px;padding:0 12px;background:var(--surface);color:var(--fg);width:100%}
.dock{position:sticky;bottom:86px;padding-top:14px;z-index:5}
@media (min-width:900px){.dock{bottom:14px}}
/* grades grid */
.gtable{width:100%;border-collapse:collapse}
.gtable th,.gtable td{padding:0}
.gtable thead th{font-size:11px;font-weight:700;color:var(--muted);padding:6px 2px;vertical-align:bottom}
.gtable tbody tr{border-top:1px solid var(--line)}
.gtable tr.hl{background:var(--warn-soft)}
.gtable th[scope=row],.gtable thead th:first-child{position:sticky;left:0;z-index:1;background:var(--surface);max-width:140px}
.gtable tr.hl th[scope=row]{background:var(--warn-soft)}
.gtable th[scope=row] .nm{overflow:hidden;text-overflow:ellipsis;max-width:140px;display:block}
.nm{border:0;background:none;padding:10px 4px;font-size:15px;font-weight:600;text-align:left;white-space:nowrap;color:var(--fg)}
.wh{border:0;background:none;font-size:11px;font-weight:700;color:var(--fg2);min-height:36px;width:100%;padding:0 2px}
.cell{position:relative;width:100%;min-width:34px;height:44px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:10px}
.cell:hover{background:var(--sunk2)}
.dot{width:24px;height:24px;border-radius:50%;border:2px solid transparent}
.dot.none{width:6px;height:6px;border:0;background:var(--line2)}
.dot.miss{width:20px;height:20px;border:2px dashed var(--q5)}
.dot.abs{width:20px;height:20px;border:2px dashed var(--faint)}
.hw{width:5px;height:5px;border-radius:50%}
.hw.done{background:var(--done)}.hw.notin{width:8px;height:8px;border:2px solid var(--q5)}
.dia{width:7px;height:7px;background:var(--ink);transform:rotate(45deg);display:inline-block;flex:none}
.cell .dia{position:absolute;top:5px;right:4px;border:1.5px solid var(--surface);width:8px;height:8px}
.ov{text-align:right;padding-right:6px!important;white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums}
.ov small{display:block;font-size:11px;font-weight:600;color:var(--muted)}

.stack .wday{padding:14px 16px}
.wday.past{background:var(--sunk2);opacity:.78}
.wday.today{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.wdh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.wdh .small{color:var(--muted)}
.wday.today .wdh .small{color:var(--accent-ink);font-weight:700}
.wcls{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:9px 0;color:var(--fg);font:inherit}
.wday.today .wcls{border-top-color:var(--line2)}
.wcls .tm{font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.wcls .ti{font-size:14px;line-height:1.35;color:var(--fg2)}
.wcls:hover .ti{color:var(--fg)}
.needp{font-size:13px;font-weight:700;color:var(--warn-ink);background:var(--warn-soft);border-radius:8px;padding:5px 10px}
.btn.warnb{background:var(--warn-soft);color:var(--warn-ink)}
.lede .btn.mini{vertical-align:middle;margin-left:4px}
.grid2.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
@media (max-width:899px){.grid2.even{grid-template-columns:minmax(0,1fr)}}
.fold{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:0 12px;margin-top:8px;border:0;border-radius:12px;background:var(--sunk2);font:inherit;font-size:14px;color:var(--fg2);text-align:left}
.fold span:nth-child(2){flex:1}
.fold u{text-decoration:none;color:var(--accent-ink);font-weight:600}
/* grades */
.policy{display:block;margin-top:6px;font-size:14px;color:var(--fg2)}
@media (min-width:900px){.glance{grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}}
.slr{grid-template-columns:minmax(64px,auto) minmax(0,1fr) auto}
.slr .sll{grid-column:1/-1;margin-top:-2px}
.gleg{margin:0 0 8px 6px}
.dot{border:0}
.dot.miss{width:20px;height:20px;border:2px solid var(--q5);background:none}
.legend .dot.none{display:inline-block}
.gtable th.gapw{font-size:11px;color:var(--muted);background:repeating-linear-gradient(45deg,var(--sunk2) 0 4px,transparent 4px 8px)}
.gtable th.gapw small{display:block;font-weight:600;font-size:10px}
.gtable td.gapw{background:repeating-linear-gradient(45deg,var(--sunk2) 0 4px,transparent 4px 8px);min-width:44px}
.ov small.up{color:var(--ok)}
/* assignments grid */
.agrid{--nmw:170px}
@media (max-width:600px){.agrid{--nmw:120px}}
.scroll.snap{scroll-snap-type:x mandatory;scroll-padding-left:var(--nmw);scroll-padding-right:124px}
.agrid .ac,.agrid .ah{scroll-snap-align:start}
.agrid .ag{font-size:13px;font-weight:700;color:var(--fg);text-align:center;padding:4px 2px;border-bottom:2px solid var(--line);margin:0 4px}
.agrid .ah{padding:6px 2px 8px}
.agrid .ah.nm0,.agrid .an{box-shadow:6px 0 8px -6px rgba(0,0,0,.28);z-index:2;padding-left:14px}
.agrid .ah.nm0,.agrid .ah.colO,.agrid .ah.colG{align-self:stretch;justify-content:flex-end}
.agrid .ah.r{justify-content:flex-end}
.agrid .colO,.agrid .colG{position:sticky;background:var(--surface);z-index:2}
.agrid .colG{right:0;padding-right:14px}
.agrid .colO{right:64px;box-shadow:-6px 0 8px -6px rgba(0,0,0,.28)}
.ak.CW,.ak.SUB,.ak.XT,.ak.XP{background:none;box-shadow:inset 0 0 0 1px var(--line2);color:var(--muted)}
.ak.XP{background:none;color:var(--muted)}
.ac.dim,.ah.dim{background:var(--sunk2)}
.ac.dim{color:var(--muted);font-weight:600}
.ac.dim:hover{background:var(--sunk)}
.ac.wk0,.ah.wk0{box-shadow:inset 1px 0 0 var(--line2)}
.ac.sc{color:var(--fg)}
.ac.sc.lo,.legend b.lo{color:var(--low);font-weight:800}
.ac.sc.mid,.legend b.mid{color:var(--warn-ink)}
.ac.dim.sc{color:var(--muted)}
.ac.dim.sc.lo{color:var(--low)}
.aleg{margin:0 14px 10px}
.lpill{display:inline-flex;width:26px;height:22px;align-items:center;justify-content:center;border-radius:6px;background:var(--bad-soft);color:var(--bad-ink);font-weight:800;box-shadow:inset 0 0 0 1.5px var(--q5)}
.legend .shade{background:var(--sunk2);border-radius:6px;padding:2px 8px}
.toggle{display:inline-flex;align-items:center;gap:10px;min-height:44px;border:0;background:none;font:inherit;font-weight:600;font-size:14px;color:var(--fg2)}
.sw2{width:40px;height:24px;border-radius:999px;background:var(--line2);position:relative;flex:none;transition:background .15s}
.sw2::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:left .15s}
.toggle[aria-pressed="true"] .sw2{background:var(--accent)}
.toggle[aria-pressed="true"] .sw2::after{left:19px}
/* one week: homework marked in the cell */
.wgrid{justify-content:start}
.wc.wq{gap:4px;justify-content:flex-start;padding:0 6px}
.wc.wq.sel{background:var(--accent-soft)}
.qb{min-height:36px;min-width:72px;padding:0 10px;border:0;border-radius:9px;background:var(--sunk2);font-size:13px;font-weight:600;color:var(--fg2)}
.qb.more{min-width:36px;background:none;font-size:16px}
.qb[aria-pressed="true"].done{background:var(--q1);color:var(--on-accent)}
.qb[aria-pressed="true"].partial{background:var(--q4);color:var(--fg)}
.qb[aria-pressed="true"].notin{background:var(--q5);color:var(--on-accent)}
.qb:disabled{opacity:.5;cursor:default}
.wst{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border-radius:9px;background:var(--sunk);font-size:13px;font-weight:600;color:var(--fg2);min-width:226px}
.wgrid .wc,.wgrid .rn{height:52px}
.wrest{justify-content:space-between;padding:12px 4px 4px;border-top:1px solid var(--line);margin-top:4px}
.stat{grid-template-columns:repeat(5,minmax(0,1fr))}
.stat button{font-size:12px;padding:0 2px;line-height:1.15}
/* review: one card per change */
.rgc .kind{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:3px}
.rgh{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.rgh>div:first-child{flex:1 1 320px;min-width:0}
.rga{gap:8px;flex-wrap:nowrap}
.rchips{display:flex;flex-wrap:wrap;gap:6px}
.rchips .stchip{min-height:34px;cursor:pointer}
.unsure{margin-top:12px;border-radius:14px;background:var(--warn-soft);padding:4px 14px 6px}
.unsure .uh{font-size:13px;font-weight:700;color:var(--warn-ink);padding:8px 0 2px}
.unsure .rv{border-top-color:var(--warn-line)}
.unsure .btn.sunk{background:var(--surface)}
.rv .why{font-weight:400}
@media (min-width:900px){.inspector{width:360px}}
.logr{padding:12px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.45}
.logr .small{margin-top:3px}
.logr:first-of-type{border-top:0}
/* students */
.scard{gap:11px}
.why{align-self:flex-start;font-size:13px;font-weight:700;color:var(--warn-ink);background:var(--warn-soft);border-radius:7px;padding:3px 9px}
.trend{font-weight:600}
.trend.up{color:var(--ok)}
.sq.done{background:var(--q1)}.sq.partial{background:var(--q4)}.sq.notin{background:none;box-shadow:inset 0 0 0 2px var(--q5)}
.sortl{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--fg2)}
.sortl select{background:var(--surface);font-weight:600}
@media print{.appbar{display:none!important}}
@media print{.tabbar,.dnav,.tools,.noprint,.dock,.wdock,.scrim,.sheet,.toast{display:none!important}body{background:#fff}.card{break-inside:avoid}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">Loading…</div></div>
<div id="sheethost"></div>
<div id="toasthost"></div>
<nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
<input type="file" id="scanin" accept="image/*,application/pdf" capture="environment" multiple hidden>
<script src="app.js"></script>
</body>
</html>
