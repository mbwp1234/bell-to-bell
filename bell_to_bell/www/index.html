<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bell to Bell</title>
<script>
/* Theme, set before the first paint. Auto: device light -> light; device dark -> dim while the
   sun is up, night after sunset. Sunset comes from HA's sun.sun via api/sun, cached in
   localStorage; with no sun reading yet a dark device gets night, as before. */
(function () {
  var mq = matchMedia("(prefers-color-scheme: dark)"), root = document.documentElement;
  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function sunDown() {
    var s = null; try { s = JSON.parse(get("btb.sun") || "null"); } catch (e) {}
    if (!s || (s.state !== "above_horizon" && s.state !== "below_horizon")) return null;
    var now = Date.now(), down = s.state === "below_horizon";
    if (down && s.rising && now >= s.rising) down = false;
    else if (!down && s.setting && now >= s.setting) down = true;
    return down;
  }
  function pick() {
    var m = get("btb.theme");
    if (m === "light" || m === "dim" || m === "night") return m;
    if (!mq.matches) return "light";
    return sunDown() === false ? "dim" : "night";
  }
  function apply() { var t = pick(), was = root.dataset.theme; root.dataset.theme = t; return t !== was; }
  apply();
  window.btbTheme = { apply: apply, pick: pick, mq: mq, mode: function () { return get("btb.theme") || "auto"; } };
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Three themes, picked in the head script: light (Mist), dim (Mist one step down, for a device
   in dark mode while the sun is up) and night (after sunset). The script always sets data-theme. */
:root{
  --bg:#DCE4E1;--surface:#F1F5F3;--sunk:#CFD9D5;--sunk2:#E5ECE9;--line:#D6DFDB;--line2:#BECBC6;
  --fg:#13201E;--fg2:#33433F;--muted:#4B5B57;--faint:#53625E;
  --accent:#0B5E51;--accent-ink:#0B5E51;--on-accent:#FFFFFF;--accent-soft:#D2E5DF;
  --live:#A63D1C;--low:#9A3719;--ok:#2B7F6E;--amber:#E39A33;
  --warn-soft:#F1E5D3;--warn-ink:#6E3A0D;--warn-line:#E3D2BA;--bad-soft:#F3DDD5;--bad-ink:#74280F;
  --ink:#13201E;--on-ink:#FFFFFF;--done:#33433F;
  --q1:#0B5E51;--q2:#2F8A78;--q3:#8CC5B8;--q4:#F2A63C;--q5:#B0421F;
  --q1t:#0B5E5133;--q2t:#2F8A7833;--q3t:#8CC5B855;--q4t:#F2A63C40;--q5t:#B0421F33;
  --scrim:rgba(19,32,30,.42);--shadow:0 10px 40px rgba(0,0,0,.18);
  --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
:root[data-theme="dim"]{
  --bg:#C8D2CE;--surface:#DCE3E0;--sunk:#BAC6C1;--sunk2:#D1DAD6;--line:#C4CEC9;--line2:#A9B7B2;
  --fg:#101C1A;--fg2:#2A3935;--muted:#3A4844;--faint:#45544F;
  --accent:#0A5549;--accent-ink:#094C42;--on-accent:#FFFFFF;--accent-soft:#C2D8D1;
  --live:#9A3719;--low:#8E3316;--ok:#26705F;--amber:#D08A2A;
  --warn-soft:#E5D8C3;--warn-ink:#5E3108;--warn-line:#D3C2A6;--bad-soft:#E6CFC6;--bad-ink:#6A240D;
  --ink:#101C1A;--on-ink:#FFFFFF;--done:#2A3935;
  --q1:#0A5549;--q2:#26705F;--q3:#7FB5A8;--q4:#D08A2A;--q5:#9A3719;
  --q1t:#0A554933;--q2t:#26705F33;--q3t:#7FB5A855;--q4t:#D08A2A40;--q5t:#9A371933;
  --scrim:rgba(16,28,26,.45);color-scheme:light}
:root[data-theme="night"]{
  --bg:#0E1513;--surface:#18211F;--sunk:#222D2A;--sunk2:#1C2624;--line:#26322F;--line2:#33433F;
  --fg:#E8EFED;--fg2:#C3D0CD;--muted:#9DB0AC;--faint:#8A9C98;
  --accent:#6CC9B3;--accent-ink:#8FDCC8;--on-accent:#06211C;--accent-soft:#14302A;
  --live:#FF8A5B;--low:#FF9B7A;--ok:#6CC9B3;--amber:#E3A14A;
  --warn-soft:#2C2318;--warn-ink:#EDB97F;--warn-line:#43341F;--bad-soft:#3A1D16;--bad-ink:#FFB49C;
  --ink:#E8EFED;--on-ink:#0E1513;--done:#C3D0CD;
  --q1:#6CC9B3;--q2:#3E9C88;--q3:#2C6A5F;--q4:#C9853F;--q5:#E9772A;
  --q1t:#6CC9B333;--q2t:#3E9C8833;--q3t:#2C6A5F66;--q4t:#C9853F40;--q5t:#E9772A33;
  --scrim:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,textarea,select{font-family:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1280px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-left)) 110px max(16px,env(safe-area-inset-right))}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.top .ttl{min-width:0;flex:1 1 300px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
h1{margin:2px 0 0;font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.1;display:flex;align-items:center;gap:10px;overflow-wrap:anywhere}
.lede{margin:4px 0 0;font-size:15px;color:var(--fg2);max-width:70ch}
.lede b.live{color:var(--live)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cdot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
h1 .cdot{width:12px;height:12px}
/* save pill */
.save{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 12px;border-radius:12px;background:var(--surface);font-size:13px;font-weight:600;white-space:nowrap}
.save i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.save.saving i{background:transparent;border:2px solid var(--muted);border-right-color:transparent;animation:spin .8s linear infinite}
.save.waiting{background:var(--warn-soft);color:var(--warn-ink)}.save.waiting i{background:var(--amber)}
.save.ro{background:var(--bad-soft);color:var(--bad-ink)}.save.ro i{background:var(--live)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:899px){.top .save.ok{display:none}}
@media (prefers-reduced-motion:reduce){.save.saving i{animation:none}}
/* buttons */
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 14px;border:0;border-radius:12px;background:var(--surface);font-weight:600;font-size:14px;text-decoration:none;color:var(--fg)}
.btn.sunk{background:var(--sunk)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.themeb{min-height:40px;padding:0 12px;font-size:13px}
.btn.inkb{background:var(--ink);color:var(--on-ink)}
.btn.block{width:100%;height:52px;font-size:16px;font-weight:700;border-radius:14px}
.btn:disabled{opacity:.5;cursor:default}
.kbd{font-size:11px;font-weight:600;border:1px solid var(--line2);border-radius:5px;padding:1px 6px;color:var(--muted)}
.btn.inkb .kbd{border-color:rgba(255,255,255,.4);color:inherit;opacity:.75}
.seg{display:flex;gap:2px;background:var(--sunk);border-radius:12px;padding:3px}
.seg button{flex:1;min-height:40px;padding:0 14px;border:0;border-radius:9px;background:none;font-weight:600;font-size:14px;color:var(--fg2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chip{max-width:320px;overflow:hidden;text-overflow:ellipsis;min-height:40px;padding:0 14px;border:0;border-radius:999px;background:var(--sunk);font-weight:600;font-size:13px;color:var(--fg2);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.link{border:0;background:none;padding:0;font:inherit;font-weight:600;color:var(--accent-ink);cursor:pointer;text-align:left;text-decoration:none}
.card{background:var(--surface);border-radius:18px;padding:16px 18px;min-width:0}
.card h2,.h2{margin:0;font-size:17px;font-weight:800}
.k{font-size:12px;font-weight:700;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px} .low{color:var(--low)}
.note-soft{background:var(--warn-soft);color:var(--warn-ink);border-radius:14px;padding:10px 14px;font-size:14px}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}
/* desktop nav */
.dnav{display:none}
@media (min-width:900px){.dnav{display:flex}.tabbar{display:none!important}.wrap{padding-bottom:40px}}
/* bottom tabs */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:4px 12px max(10px,env(safe-area-inset-bottom));box-shadow:0 -1px 0 var(--line)}
.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;border:0;background:none;font-size:11px;font-weight:600;color:var(--muted)}
.tabbar button[aria-current="page"]{color:var(--accent-ink)}
/* day + class strips */
.strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px;margin:0 -2px}
.strip::-webkit-scrollbar{display:none}
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin:8px 0 10px;max-width:560px}
.days button{min-height:44px;border:0;border-radius:10px;background:none;font-weight:600;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.days button small{font-size:11px;font-weight:500;color:var(--faint)}
.days button[aria-pressed="true"]{background:var(--surface);color:var(--fg)}
.days button.today::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--live);margin-top:2px}
.pill{flex:none;border:0;border-radius:12px;padding:7px 13px 8px;text-align:left;min-height:48px;background:var(--surface);color:var(--fg)}
.pill .a{display:block;font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.pill .b{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600}
.pill[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--fg)}
.pill.live{box-shadow:inset 0 0 0 2px var(--live)}.pill.live .a{color:var(--live)}
/* today */
.todaygrid{display:flex;gap:18px;align-items:flex-start;justify-content:center}
.railcard{flex:1 1 0;min-width:0}
.todaygrid.closed .railcard{max-width:880px}
.gpane{flex:1 1 0;min-width:0;position:sticky;top:12px}
.dayhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:6px}
.dayhead h2{font-size:21px}
.step{display:grid;grid-template-columns:50px minmax(0,1fr) 42px;gap:12px;padding:11px 0;border-top:1px solid var(--line);align-items:baseline}
.step:first-child{border-top:0}
.step .t{font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.step .m{font-size:12px;color:var(--faint);text-align:right;font-variant-numeric:tabular-nums}
.step .n{font-size:15px;font-weight:600;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.step .n .tag{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.step .d{font-size:14px;color:var(--fg2);margin-top:3px}
.step .d p{margin:4px 0 0}
.step.past .t,.step.past .n,.step.past .m{color:var(--faint)}
.step.past .d{color:var(--faint)}
.step.now{background:var(--surface);box-shadow:inset 0 0 0 2px var(--live);border-radius:14px;padding:12px;margin:6px -12px;border-top:0}
.step.now + .step{border-top:0}
.step.now .t,.step.now .m{color:var(--live);font-weight:700}
.prog{height:4px;border-radius:2px;background:var(--sunk);overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;background:var(--live)}
.board{background:var(--sunk2);border-radius:10px;padding:10px 14px;margin-top:8px;font-family:var(--mono);font-size:13px;line-height:1.85;overflow-x:auto;white-space:nowrap}
.board .cap{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:normal;margin-bottom:4px}
.todaygrid.closed .board{font-size:16px}
.group{background:var(--warn-soft);border-radius:12px;padding:8px 12px 4px;margin-top:10px}
.group .gk{font-size:12px;font-weight:700;color:var(--warn-ink);padding-bottom:2px}
.group .kid{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;font-size:14px;border-top:1px solid var(--warn-line);text-decoration:none;color:inherit;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.group .kid:first-of-type{border-top:0}
.group .kid span:last-child{color:var(--warn-ink)}
.exit{background:var(--accent-soft);border-radius:12px;padding:10px 12px;margin-top:8px}
.exit .a{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line2);font-family:var(--mono);font-size:13px}
.watch{background:var(--warn-soft);border-radius:12px;padding:10px 12px 10px 28px;margin:8px 0 0;color:var(--fg)}
.watch li{margin:3px 0}
.printbox{background:var(--accent-soft);border-radius:12px;padding:10px 12px;margin:0 0 10px}
.printbox .n{font-size:12px;font-weight:700;color:var(--accent-ink);text-transform:uppercase;letter-spacing:.04em}
.printbox ul{margin:4px 0 0;padding-left:18px}
.printbox li{margin:3px 0}
.hwbox{background:var(--sunk2);border-radius:12px;padding:10px 12px;margin:0 0 10px}
.hwbox .n{font-size:12px;font-weight:700;color:var(--fg2);text-transform:uppercase;letter-spacing:.04em}
.hwr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line2)}
.hwbox .row+.hwr{border-top:0}
.hwr .btn{flex:none}
.hwr.owed .small{color:var(--warn-ink)}
.hwk{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--accent-ink);margin-right:4px}
.hwr.owed .hwk{color:var(--warn-ink)}
.hwt{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent-ink)}
input[type=date]{font-size:16px;height:46px;border:0;border-radius:12px;background:var(--sunk2);padding:0 12px;width:100%;color:var(--fg)}
.gap{border:1.5px dashed var(--line2);border-radius:12px;padding:12px;margin-top:10px;background:var(--sunk2)}
.reqbox{background:var(--warn-soft);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;margin-top:10px}
.reqbox b{color:var(--warn-ink)}
.reqbox input{font-size:16px;height:46px;border:0;border-radius:10px;padding:0 12px;background:var(--surface);color:var(--fg);width:100%}
.dock{position:sticky;bottom:86px;padding-top:14px;z-index:5}
@media (min-width:900px){.dock{bottom:14px}}
/* grades grid */
.gtable{width:100%;border-collapse:collapse}
.gtable th,.gtable td{padding:0}
.gtable thead th{font-size:11px;font-weight:700;color:var(--muted);padding:6px 2px;vertical-align:bottom}
.gtable tbody tr{border-top:1px solid var(--line)}
.gtable tr.hl{background:var(--warn-soft)}
.gtable th[scope=row],.gtable thead th:first-child{position:sticky;left:0;z-index:1;background:var(--surface);max-width:140px}
.gtable tr.hl th[scope=row]{background:var(--warn-soft)}
.gtable th[scope=row] .nm{overflow:hidden;text-overflow:ellipsis;max-width:140px;display:block}
.nm{border:0;background:none;padding:10px 4px;font-size:15px;font-weight:600;text-align:left;white-space:nowrap;color:var(--fg)}
.wh{border:0;background:none;font-size:11px;font-weight:700;color:var(--fg2);min-height:36px;width:100%;padding:0 2px}
.cell{position:relative;width:100%;min-width:34px;height:44px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:10px}
.cell:hover{background:var(--sunk2)}
.dot{width:24px;height:24px;border-radius:50%;border:2px solid transparent}
.dot.none{width:6px;height:6px;border:0;background:var(--line2)}
.dot.miss{width:20px;height:20px;border:2px dashed var(--q5)}
.dot.abs{width:20px;height:20px;border:2px dashed var(--faint)}
.hw{width:5px;height:5px;border-radius:50%}
.hw.done{background:var(--done)}.hw.notin{width:8px;height:8px;border:2px solid var(--q5)}
.dia{width:7px;height:7px;background:var(--ink);transform:rotate(45deg);display:inline-block;flex:none}
.cell .dia{position:absolute;top:5px;right:4px;border:1.5px solid var(--surface);width:8px;height:8px}
.ov{text-align:right;padding-right:6px!important;white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums}
.ov small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--fg2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:50%;display:inline-block}
.scroll{overflow-x:auto}
/* one-week grid */
.wgrid{display:grid;align-items:center}
.wgrid .hd{font-size:12px;font-weight:600;color:var(--fg2);padding:8px 4px;text-align:center;line-height:1.25}
.wgrid .hd small{display:block;font-weight:500;color:var(--muted)}
.wgrid .rn{font-size:14px;font-weight:600;padding:0 4px;border-top:1px solid var(--line);height:42px;display:flex;align-items:center;position:sticky;left:0;z-index:1;background:var(--surface)}
.wgrid .hd:first-child{position:sticky;left:0;z-index:1;background:var(--surface)}
.wc{position:relative;height:42px;border:0;border-top:1px solid var(--line);background:none;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--fg);padding:0 4px}
.wc .bar{width:28px;height:5px;border-radius:3px;background:var(--sunk);overflow:hidden}.wc .bar i{display:block;height:100%}
.wc.sel{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft);border-radius:8px}
.wc .dia{position:absolute;top:7px;right:7px}
.wc.st{color:var(--muted);font-weight:600;font-size:13px}.wc.st.bad{color:var(--low)}
.wc.q{border-top-right-radius:8px}.wc.q::after{content:"";position:absolute;top:1px;right:1px;border-top:9px solid var(--amber);border-left:9px solid transparent}
.wc .buf{min-width:48px;text-align:center;border-radius:6px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--accent);padding:2px 6px}
.keys{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--fg2);margin-top:12px}
.split{display:flex;gap:16px;align-items:flex-start}
.split>.main{flex:1;min-width:0}
.inspector{width:320px;flex:none;position:sticky;top:12px}
/* editor */
.ed{display:flex;flex-direction:column;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:16px}
.ed:last-child{border-bottom:0;margin-bottom:0}
.ed .eh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ed .et{font-size:16px;font-weight:700}
.stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--sunk2);border-radius:12px;padding:3px}
.stat button{min-height:42px;border:0;border-radius:9px;background:none;font-size:13px;font-weight:600;color:var(--fg2)}
.stat button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.stat button:disabled{opacity:.55;cursor:default}
.ptsrow{display:flex;align-items:center;gap:10px}
.stepb{width:48px;height:48px;border:0;border-radius:12px;background:var(--sunk);font-size:22px;font-weight:600}
.ptsrow input{width:72px;height:48px;text-align:center;font-size:24px;font-weight:800;border:0;border-radius:12px;background:var(--sunk2)}
.ptsrow .of{font-weight:600;color:var(--muted)}
.codes{display:flex;gap:3px}
.codes button{flex:1;min-width:0;height:22px;border:0;border-radius:4px;padding:0}
.c2{background:var(--q1)}.c1{background:var(--q3)}.c0{background:var(--q5)}.cb{background:var(--sunk2);box-shadow:inset 0 0 0 1px var(--line2)}
textarea,input[type=text]{font-size:16px;line-height:1.4;border:0;border-radius:12px;background:var(--sunk2);padding:10px 12px;width:100%;color:var(--fg);resize:vertical}
textarea{min-height:64px}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;min-height:44px}
.chk input{width:22px;height:22px;accent-color:var(--ink)}
.claude{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--sunk2);border-radius:12px;padding:8px 8px 8px 12px;font-size:13px}
.claude span{display:flex;align-items:center;gap:8px}
/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92dvh;z-index:41;background:var(--surface);border-radius:24px 24px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line2);margin:8px auto 0;flex:none}
.sheet .sh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:10px 20px 12px;border-bottom:1px solid var(--line);flex:none}
.sheet .sh h2{margin:2px 0 0;font-size:22px;font-weight:800}
.sheet .sb{overflow-y:auto;padding:14px 20px 20px;flex:1;-webkit-overflow-scrolling:touch}
.sheet .sf{padding:12px 20px max(16px,env(safe-area-inset-bottom));border-top:1px solid var(--line);flex:none;display:flex;flex-direction:column;gap:10px}
.iconb{width:44px;height:44px;border:0;border-radius:12px;background:var(--sunk);display:inline-flex;align-items:center;justify-content:center;flex:none}
@media (min-width:900px){.sheet{left:auto;top:0;width:460px;max-height:none;border-radius:0}.sheet .grab{display:none}}
.xrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.xrow:first-child{border-top:0}
.xseg{display:flex;gap:4px;background:var(--sunk2);border-radius:12px;padding:3px}
.xseg button{width:52px;height:40px;border:0;border-radius:9px;background:none;font-size:15px;font-weight:700;color:var(--fg2)}
.xseg button[aria-pressed="true"].r{background:var(--q1);color:#fff}
.xseg button[aria-pressed="true"].h{background:var(--q3);color:var(--fg)}
.xseg button[aria-pressed="true"].w{background:var(--q5);color:#fff}
.xseg button[aria-pressed="true"].done{background:var(--q1);color:#fff}
.xseg button[aria-pressed="true"].partial{background:var(--q3);color:var(--fg)}
.xseg button[aria-pressed="true"].notin{background:var(--q5);color:#fff}
.xseg button[aria-pressed="true"].absent,.xseg button[aria-pressed="true"].a{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--faint)}
/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:60;background:var(--ink);color:var(--on-ink);border-radius:12px;min-height:48px;padding:0 6px 0 16px;display:flex;align-items:center;gap:12px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.toast button{height:38px;padding:0 14px;border:0;border-radius:9px;background:rgba(127,127,127,.25);color:inherit;font-weight:700}
@media (min-width:900px){.toast{bottom:24px}}
/* cards, student, sheet views */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.scard{display:flex;flex-direction:column;gap:10px;background:var(--surface);border-radius:16px;padding:14px;border:0;text-align:left;width:100%;color:var(--fg)}
.scard.flag{box-shadow:inset 0 0 0 2px var(--warn-line)}
.meter{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}.meter i{display:block;height:100%;background:var(--done)}
.sq{width:12px;height:12px;border-radius:3px;display:inline-block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi .v{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.tag{font-size:13px;font-weight:500;padding:5px 10px;border-radius:999px;display:inline-block}
.tag.good{background:var(--accent-soft);color:var(--accent-ink)}.tag.work{background:var(--warn-soft);color:var(--warn-ink)}
.cols{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(48px,1fr);gap:10px;min-width:520px;align-items:end}
.wcol{display:flex;flex-direction:column;gap:6px}
.wcol .p{font-size:12px;font-weight:600;text-align:center;min-height:16px}
.wcol .well{height:120px;background:var(--sunk2);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden}
.wcol .well i{display:block;width:100%;border-radius:8px 8px 0 0}
.wcol .att{height:5px;background:var(--sunk);border-radius:3px;overflow:hidden}.wcol .att i{display:block;height:100%;background:var(--done)}
.wcol .l{font-size:12px;color:var(--muted);text-align:center}
.lrow{display:grid;grid-template-columns:64px minmax(140px,1.1fr) 150px minmax(180px,2fr);gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.lrow .nt{border:0;background:none;text-align:left;padding:6px;border-radius:8px;font-size:14px;color:var(--fg2)}
.lrow .nt:hover{background:var(--sunk2)}
.sc{display:flex;align-items:center;gap:8px}.sc .meter{flex:1}.sc b{width:48px;text-align:right;font-variant-numeric:tabular-nums}
.stchip{font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--sunk2);color:var(--muted);white-space:nowrap;border:0}
.stchip.bad{background:var(--warn-soft);color:var(--warn-ink)}.stchip.ok{background:var(--accent-soft);color:var(--accent-ink)}
@media (max-width:720px){.lrow{grid-template-columns:minmax(0,1fr) 120px}.lrow .w{display:none}.lrow .nt{grid-column:1/-1}}
.dist{position:relative;height:96px;margin-top:6px}
.dist .line{position:absolute;left:0;right:0;top:44px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--q5t) 0 60%,var(--q4t) 60% 70%,var(--q2t) 70% 100%)}
.dist .pt{position:absolute;top:39px;width:14px;height:14px;margin-left:-7px;border-radius:50%;box-shadow:0 0 0 2px var(--surface)}
.dist .lb{position:absolute;transform:translateX(-50%);font-size:12px;font-weight:600;white-space:nowrap;border:0;background:var(--surface);padding:0 3px;color:var(--fg2)}
.pg{display:grid;gap:3px;align-items:center}
.pg .h{font-size:11px;text-align:center;color:var(--muted)}.pg .h.s{font-weight:700;color:var(--fg2)}
.pg .q{height:20px;border-radius:4px}
.callouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.callout{border-radius:16px;padding:14px 16px;font-size:14px;line-height:1.5}
.callout .k{margin-bottom:2px}
.callout.warn{background:var(--warn-soft)}.callout.warn .k{color:var(--warn-ink)}
.callout.good{background:var(--accent-soft)}.callout.good .k{color:var(--accent-ink)}
.callout.plain{background:var(--surface)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px}
@media (max-width:899px){.grid2{grid-template-columns:minmax(0,1fr)}}
.wr{display:grid;grid-template-columns:44px 12px minmax(0,1fr);gap:8px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line);font-size:14px;border-left:0;border-right:0;border-bottom:0;background:none;width:100%;text-align:left;color:var(--fg)}
.wr .t{font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.wr .cdot{align-self:center;width:8px;height:8px}
.gapt{color:var(--warn-ink);font-weight:600}
.prep{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;align-items:start}
.prep input{width:20px;height:20px;accent-color:var(--accent);margin-top:1px}
.prep .done{color:var(--faint);text-decoration:line-through}
.game{background:var(--surface);border-radius:14px;padding:12px 14px}
.game summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-weight:700}
.game summary::-webkit-details-marker{display:none}
.game ol{margin:8px 0 0;padding-left:20px;font-size:14px;color:var(--fg2)}
.rv{display:grid;grid-template-columns:minmax(0,90px) 70px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.rv.unsure{background:var(--warn-soft);border-radius:12px;border-top:0;padding:9px 10px;margin:4px -10px}
@media (max-width:720px){.rv{grid-template-columns:minmax(0,1fr) 64px}.rv .why{grid-column:1/-1}.rv .act{grid-column:1/-1}}
.banner{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--ink);color:var(--on-ink);border-radius:14px;padding:0 14px;min-height:52px;font-weight:600;font-size:14px;border:0;width:100%;text-align:left}
.banner .dia{background:var(--on-ink)}
.problem{max-width:560px;margin:60px auto;text-align:center}
@media print{.tabbar,.dnav,.tools,.noprint,.dock,.scrim,.sheet,.toast{display:none!important}body{background:#fff}.card{break-inside:avoid}}
</style>
</head>

<div id="sheethost"></div>
<div id="toasthost"></div>
<nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
<input type="file" id="scanin" accept="image/*,application/pdf" capture="environment" multiple hidden>
<script src="app.js"></script>
